spring.application.name=ats-system

spring.datasource.url=jdbc:postgresql://localhost:5432/ats
spring.datasource.username=ats
spring.datasource.password=ats

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB

ats.cors.allowed-origins=http://localhost:5173
ats.rate-limit.creates-per-minute=30

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
