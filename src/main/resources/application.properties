spring.application.name=ats-system

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ats}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ats}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB

ats.cors.allowed-origins=${ATS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
ats.rate-limit.creates-per-minute=${ATS_RATE_LIMIT_CREATES_PER_MINUTE:30}

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Keep the operational surface small. Health supports container orchestration;
# Prometheus provides scrapeable JVM, HTTP, and datasource metrics.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,skillCatalog
