# Defaults mimic a small rented VPS: 2 vCPU / 4 GiB split across services.
# Override in .env (see .env.example). Recreate containers after changing limits:
#   docker compose up -d --force-recreate
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-0.50}"
          memory: ${POSTGRES_MEMORY:-1G}
        reservations:
          cpus: "${POSTGRES_CPUS_RESERVE:-0.10}"
          memory: ${POSTGRES_MEMORY_RESERVE:-256M}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ats}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ats}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      ATS_CORS_ALLOWED_ORIGINS: ${ATS_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost}
      ATS_RATE_LIMIT_CREATES_PER_MINUTE: ${ATS_RATE_LIMIT_CREATES_PER_MINUTE:-30}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-1.25}"
          memory: ${BACKEND_MEMORY:-2816M}
        reservations:
          cpus: "${BACKEND_CPUS_RESERVE:-0.25}"
          memory: ${BACKEND_MEMORY_RESERVE:-768M}

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-0.25}"
          memory: ${WEB_MEMORY:-256M}
        reservations:
          cpus: "${WEB_CPUS_RESERVE:-0.05}"
          memory: ${WEB_MEMORY_RESERVE:-64M}

volumes:
  postgres_data:
